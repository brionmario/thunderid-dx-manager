# Where the sources live. Paths are absolute, or relative to this file.
#
# `repo` names the upstream each entry mirrors. With `--sources-root DIR` every path is
# replaced by DIR/<repo name>, which is how the workflow points the same configuration at
# its own checkouts. There is deliberately no second configuration file for CI: the two
# drifted once already, CI silently indexed no end-to-end suites for a day, and every cell
# in the E2E column read zero without anything saying why.
#
# `product` is the ThunderID server monorepo: it owns the backend executors, the wire
# constants, the console's flow element palette, and the SDK specification that the
# client surface and configuration axes are read from.
#
# The four SDK entries are the repos listed in the specification's repository topology.
# Keep `id` stable: it is the column key in the report and in overrides.yaml.

product: /Users/brion/Desktop/thunderid/sdk-parity
product_repo: thunder-id/thunderid

sdks:
  - id: javascript
    label: JavaScript
    repo: thunder-id/javascript-sdks
    path: /Users/brion/Desktop/thunderid/thunderid-sdk-components/sdks/javascript-sdks
    globs: ["*.ts", "*.tsx"]
    # A JavaScript "SDK" is eleven published packages. Without this the column answers
    # "somewhere in the repo", which hides the case the layering makes likely: react has
    # it and vue does not.
    units: 'packages/([^/]+)/'
    # Layers, from the specification's architecture section. A package is only expected to
    # carry what its layer implies: no Platform package renders an input, and nothing below
    # Core Lib ships UI. The breakdown groups by layer so absence can be read correctly
    # rather than counted as eleven gaps.
    layers:
      Agnostic: [javascript]
      Platform: [browser, node]
      Core Lib: [react, vue]
      Framework Specific: [nextjs, nuxt, react-router, tanstack-router, express]
      Integration: [better-auth]
    exclude: ["node_modules", "/dist/", "/build/", "__tests__", ".test.", ".spec.", "/docs/"]
    e2e: ["tests/e2e"]
    # The JavaScript surface is spread across the Agnostic, Platform and Framework
    # Specific clients. All of them count: an operation is on the surface if a consumer
    # of any published package can call it.
    client:
      - packages/javascript/src/ThunderIDJavaScriptClient.ts
      - packages/browser/src/ThunderIDBrowserClient.ts
      - packages/node/src/ThunderIDNodeClient.ts
      - packages/nextjs/src/ThunderIDNextClient.ts
    method_pattern: '^\s{2}(?:public\s+)?(?:async\s+)?(?:override\s+)?([a-z][A-Za-z0-9_]*)\s*(?:<[^(]*>)?\('

  - id: ios
    label: iOS
    repo: thunder-id/ios-sdks
    path: /Users/brion/Desktop/thunderid/thunderid-sdk-components/sdks/ios
    globs: ["*.swift"]
    units: 'Sources/([^/]+)/'
    layers:
      Agnostic and Platform: [ThunderID]
      Core Lib: [ThunderIDSwiftUI]
    exclude: ["/Tests/", "/.build/", "Samples/", "/Pods/"]
    e2e: ["Tests/e2e"]
    client: Sources/ThunderID/ThunderIDClient.swift
    method_pattern: '^\s*public\s+func\s+([a-zA-Z0-9_]+)'

  - id: android
    label: Android
    repo: thunder-id/android-sdks
    path: /Users/brion/Desktop/thunderid/thunderid-sdk-components/sdks/android
    globs: ["*.kt"]
    units: 'kotlin/dev/thunderid/([^/]+)/'
    layers:
      Agnostic and Platform: [android]
      Core Lib: [compose]
    exclude: ["/test/", "/androidTest/", "/build/", "samples/"]
    e2e: ["tests/e2e"]
    client: src/main/kotlin/dev/thunderid/android/ThunderIDClient.kt
    method_pattern: '^\s*(?:public\s+)?(?:suspend\s+)?fun\s+([a-zA-Z0-9_]+)'

  - id: flutter
    label: Flutter
    repo: thunder-id/flutter-sdks
    path: /Users/brion/Desktop/thunderid/thunderid-sdk-components/sdks/flutter
    globs: ["*.dart"]
    units: 'lib/()'
    exclude: ["/test/", "/build/", "samples/", "/Pods/", ".g.dart", ".freezed.dart"]
    e2e: ["tests/e2e"]
    client: lib/src/thunderid_client.dart
    method_pattern: '^\s{2}(?:Future<[^>]*>|Stream<[^>]*>|void|bool|int|double|String\??|[A-Z][A-Za-z0-9_<>,?\s]*)\s+([a-z][A-Za-z0-9_]*)\s*\('

# `e2e` lists each SDK's end-to-end suite, relative to its root. These are indexed
# separately from the SDK's own sources: a capability can be implemented and untested, and
# the report distinguishes the two rather than treating a passing grep as proof of either.

# Source files inside the product repo. Changing a path here is how the tool survives an
# upstream refactor, rather than by editing the extractors.
sources:
  spec:            docs-internals/sdk-development/spec.md
  executor_dir:    backend/internal/flow/executor
  executor_consts: backend/internal/flow/executor/constants.go
  wire_consts:     backend/pkg/thunderidengine/providers/constants.go
  element_types:   frontend/apps/console/src/features/flows/models/elements.ts
  # The product's own suites. A capability these exercise but no SDK does is the sharpest
  # version of a gap: the behaviour works and is reachable, and no client drives it.
  product_tests:
    - tests/integration
    - tests/e2e
