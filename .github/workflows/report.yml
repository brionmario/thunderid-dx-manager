# Regenerates the SDK parity report and publishes it to GitHub Pages.
#
# The report is only as current as the checkouts it reads, so it is rebuilt on a schedule
# rather than committed: a capability added to the server yesterday should show up as a
# gap today without anyone here doing anything.
#
# The sources are read at their default branch. Nothing from them is executed - they are
# parsed as text - so a scheduled run never runs code from another repository.

name: Parity report

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      product_ref:
        description: Branch or tag of the product repository to measure
        default: main
  push:
    branches: [main]
    paths:
      - "parity/**"
      - "catalogue/**"
      - "parity.config.yaml"
      - ".github/workflows/report.yml"

permissions:
  contents: write   # the run commits its snapshot, which is what the next run compares against
  pages: write
  id-token: write

# A later run should win, but never interrupt a publish that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous snapshot has to be on disk to compare against, and the commit at
          # the end needs somewhere to push to.
          fetch-depth: 0

      - name: Check out the product
        uses: actions/checkout@v4
        with:
          repository: thunder-id/thunderid
          ref: ${{ inputs.product_ref || 'main' }}
          path: sources/thunderid
          token: ${{ secrets.SOURCES_TOKEN || github.token }}

      - name: Check out the JavaScript SDKs
        uses: actions/checkout@v4
        with:
          repository: thunder-id/javascript-sdks
          path: sources/javascript-sdks
          token: ${{ secrets.SOURCES_TOKEN || github.token }}

      - name: Check out the iOS SDKs
        uses: actions/checkout@v4
        with:
          repository: thunder-id/ios-sdks
          path: sources/ios-sdks
          token: ${{ secrets.SOURCES_TOKEN || github.token }}

      - name: Check out the Android SDKs
        uses: actions/checkout@v4
        with:
          repository: thunder-id/android-sdks
          path: sources/android-sdks
          token: ${{ secrets.SOURCES_TOKEN || github.token }}

      - name: Check out the Flutter SDKs
        uses: actions/checkout@v4
        with:
          repository: thunder-id/flutter-sdks
          path: sources/flutter-sdks
          token: ${{ secrets.SOURCES_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # One configuration file, repointed at the checkouts above. A second CI-only copy
      # drifted from the local one once and silently reported no end-to-end coverage
      # anywhere, so there is no second copy any more.
      # Open pull requests and DX issues are read through the gh CLI, which is preinstalled
      # on the runner. The default token reads public repositories, which is all of them; a
      # SOURCES_TOKEN is only needed if one becomes private.
      # snapshots/latest.json is the previous run's verdicts, committed by that run. It is
      # read before being overwritten, so each run is compared against the one before it.
      - name: Generate the report
        env:
          GH_TOKEN: ${{ secrets.SOURCES_TOKEN || github.token }}
        run: |
          python3 -m parity --sources-root sources \
            --baseline snapshots/latest.json \
            --snapshot out/snapshot.json \
            --html out/index.html --json out/parity.json | tee run.log
          if grep -q '^warning:' run.log; then
            echo "::error::the report generated with warnings; see the log above"
            exit 1
          fi

      # Keeping every snapshot is what makes a comparison possible over any span, not just
      # against last week. They hold verdicts only, so a year of them is a couple of
      # megabytes.
      - name: Commit the snapshot
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          summary="$(sed -n 's/^since /Compared against /p' run.log)"

          # Two runs can finish close enough together that the second is rejected as
          # non-fast-forward, which is how the first manual run failed. The snapshot in out/
          # is this run's own output and out/ is ignored, so the whole commit can simply be
          # rebuilt on top of whatever landed meanwhile and pushed again.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            mkdir -p snapshots
            cp out/snapshot.json "snapshots/$stamp.json"
            cp out/snapshot.json snapshots/latest.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshots

            # Staged rather than working-tree diff: on the first run these files are
            # untracked, and git diff does not see untracked files, so the check would pass
            # and nothing would ever be committed.
            if git diff --cached --quiet -- snapshots; then
              echo "verdicts are unchanged since the last run; nothing to commit"
              exit 0
            fi

            git commit --quiet -m "Record SDK parity verdicts for $stamp" \
                       -m "${summary:-No baseline was available for this run.}"
            if git push --quiet; then
              echo "committed snapshots/$stamp.json"
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the new tip"
          done
          echo "::error::could not push the snapshot after three attempts"
          exit 1

      - name: Report regressions
        run: |
          if grep -q '^regression:' run.log; then
            grep '^regression:' run.log | while read -r line; do echo "::warning::$line"; done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
